<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>אזעקה · אבן יהודה</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <header>
    <h1>🛡️ אזעקה</h1>
    <button id="btnOut" class="ghost" hidden>יציאה</button>
  </header>

  <main>
    <section id="login" class="card center" hidden>
      <p>כניסה עם חשבון Google המורשה</p>
      <button id="btnLogin" class="primary">התחברות עם Google</button>
      <p id="loginErr" class="err"></p>
    </section>

    <section id="app" hidden>
      <div id="msg" class="msg" hidden></div>

      <div class="card" id="statusCard">
        <div class="row">
          <div>
            <div class="label">מצב נוכחי</div>
            <div id="modeNow" class="mode-now">—</div>
          </div>
          <div class="end">
            <span id="power" class="chip" hidden></span>
            <span id="online" class="chip">…</span>
            <button id="btnRefresh" class="ghost" title="רענון">⟳</button>
          </div>
        </div>
        <div id="alarmBanner" class="alarm-banner" hidden>🚨 אזעקה פעילה</div>
        <div class="modes">
          <button data-mode="arm" class="mode arm">🔒<span>דריכה מלאה</span></button>
          <button data-mode="home" class="mode home">🏠<span>דריכת בית</span></button>
          <button data-mode="disarm" class="mode disarm">🔓<span>נטרול</span></button>
          <button data-mode="sos" class="mode sos">🆘<span>מצוקה</span></button>
        </div>
      </div>

      <details class="card fold">
        <summary><h2>גלאים</h2></summary>
        <ul id="sensors" class="list"><li class="muted">טוען…</li></ul>
      </details>

      <details class="card fold">
        <summary><h2>הגדרות היחידה</h2></summary>
        <div id="settings"><p class="muted">טוען…</p></div>
      </details>

      <details class="card fold">
        <summary><h2>אירועים אחרונים</h2></summary>
        <ul id="logs" class="list small"><li class="muted">טוען…</li></ul>
      </details>

      <details class="card">
        <summary>מכשיר ופרטים טכניים</summary>
        <label>מכשיר: <select id="devSel"></select></label> <button id="btnCopy" class="ghost">📋 העתקה</button>
        <pre id="raw"></pre>
      </details>
    </section>
  </main>

  <script type="module" src="app.js?v=6"></script>
<script>/* גביש: כפתור קבוע בפינה השמאלית העליונה, מבודד מה-CSS של הדף */(function(){if(document.getElementById("gavish-hub"))return;var h=document.createElement("div");h.id="gavish-hub";h.style.cssText="position:fixed!important;top:10px!important;left:10px!important;width:36px!important;height:36px!important;z-index:2147483000!important;margin:0!important;padding:0!important;display:block!important;transform:none!important;";var r=h.attachShadow({mode:"open"});r.innerHTML='<style>a{display:flex;align-items:center;justify-content:center;width:36px;height:36px;box-sizing:border-box;font-size:19px;line-height:1;text-decoration:none;background:rgba(15,31,61,.84);border:1px solid rgba(255,255,255,.32);border-radius:11px;box-shadow:0 4px 14px rgba(0,0,0,.3);font-family:sans-serif}a:hover{background:rgba(40,70,130,.95)}</style><a href="https://gavishori.github.io/" title="גביש - כל הפרויקטים" aria-label="גביש - כל הפרויקטים">💎</a>';document.body.insertBefore(h,document.body.firstChild)})();</script>
</body>
</html>
